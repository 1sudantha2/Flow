name: Arena CI

# Fast feedback loop for the Arena working branch: formatting + compilation
# only. The full pipeline still lives in build.yml.
on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-check:
    name: Spotless + Compile (github debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history is required: Spotless ratchets against a fixed commit
          # (52c4928), which is unreachable in a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        run: ./gradlew spotlessCheck --build-cache --stacktrace

      - name: Compile app (github debug)
        run: ./gradlew :app:assembleGithubDebug --build-cache --stacktrace

      - name: Upload APK on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: arena-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 7
