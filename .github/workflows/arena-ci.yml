name: Arena CI

# Fast feedback loop for the Arena working branch: formatting, compilation and
# unit tests. The full pipeline still lives in build.yml.
#
# Because the driving agent cannot download raw job logs (they live on Azure
# blob storage), every gradle step runs with continue-on-error and tees its
# output to a file; annotation steps then convert the interesting lines
# (spotless violations, kotlin compile errors, test failures) into ::error::
# annotations, which are readable through the GitHub REST API.
on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-check:
    name: Spotless + Compile + Unit tests (github debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Full history is required: Spotless ratchets against a fixed commit
          # (52c4928), which is unreachable in a shallow clone.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check Kotlin formatting
        id: spotless
        continue-on-error: true
        run: ./gradlew spotlessCheck --build-cache 2>&1 | tee /tmp/step_spotless.log

      - name: Compile app (github debug)
        id: compile
        continue-on-error: true
        run: ./gradlew :app:assembleGithubDebug --build-cache 2>&1 | tee /tmp/step_compile.log

      - name: Run unit tests (github debug)
        id: tests
        continue-on-error: true
        run: ./gradlew :app:testGithubDebugUnitTest --build-cache --max-workers=1 2>&1 | tee /tmp/step_tests.log

      - name: Surface spotless violations as annotations
        if: always() && steps.spotless.outcome == 'failure'
        run: |
          set -u
          grep -E '^\S+\.(kt|kts)' /tmp/step_spotless.log | head -10 | while IFS= read -r line; do
            echo "::error::needs formatting: $line"
          done

      - name: Surface compile errors as annotations
        if: always() && steps.compile.outcome == 'failure'
        run: |
          set -u
          grep -E '^e: ' /tmp/step_compile.log | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if ! grep -qE '^e: ' /tmp/step_compile.log; then
            echo "::error::compile step failed without kotlin errors; see run log"
          fi

      - name: Surface test failures as annotations
        if: always() && steps.tests.outcome == 'failure'
        run: |
          set -u
          grep -E 'FAILED' /tmp/step_tests.log | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done

      - name: Fail the job if any check failed
        if: always() && (steps.spotless.outcome == 'failure' || steps.compile.outcome == 'failure' || steps.tests.outcome == 'failure')
        run: exit 1

      - name: Upload APK on manual dispatch
        if: always() && github.event_name == 'workflow_dispatch' && steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: arena-debug-apk
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  release-apk:
    name: Signed release APK (github universal)
    needs: quick-check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore (optional)
        id: keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release keystore decoded."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No keystore secret — app/build.gradle.kts falls back to debug signing."
          fi

      # The release buildType keeps minification + resource shrinking; without a
      # keystore secret the gradle fallback signs with the debug key so the APK
      # is directly installable.
      - name: Build release APK
        id: assemble
        continue-on-error: true
        run: ./gradlew :app:assembleGithubRelease --build-cache --stacktrace 2>&1 | tee /tmp/step_release.log
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Surface release build errors as annotations
        if: always() && steps.assemble.outcome == 'failure'
        run: |
          set -u
          grep -E '^e: ' /tmp/step_release.log | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if ! grep -qE '^e: ' /tmp/step_release.log; then
            echo "::error::release assemble failed without kotlin errors; see run log"
          fi

      - name: Report APK sizes
        if: always() && steps.assemble.outcome == 'success'
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/github/release/*.apk)
          {
            echo '## Release APKs'
            echo
            echo '| APK | Size |'
            echo '|---|---:|'
            for apk in "${apks[@]}"; do
              bytes=$(stat --format='%s' "$apk")
              size=$(awk -v bytes="$bytes" 'BEGIN { printf "%.2f MiB", bytes / 1048576 }')
              printf '| `%s` | %s |\n' "$(basename "$apk")" "$size"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload universal release APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-release-apk
          path: app/build/outputs/apk/github/release/app-github-universal-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload ARM64 release APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: flowtube-arm64-release-apk
          path: app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

